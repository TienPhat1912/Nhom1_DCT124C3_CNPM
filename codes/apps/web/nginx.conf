# Revalidate the app on each visit so LAN clients receive fixes after a rebuild.
# API responses keep the backend's no-store policy.
map $uri $web_cache_control {
    default "no-cache";
    ~^/(api|openapi)/ "";
}
server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;
    server_tokens off;
    add_header Cache-Control $web_cache_control always;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy no-referrer always;
    add_header X-Frame-Options DENY always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data:; connect-src 'self'; media-src 'self' blob:; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;
    location /api/ { proxy_pass http://api:8080; proxy_set_header Host $host; proxy_read_timeout 30s; }
    location /openapi/ { proxy_pass http://api:8080; }
    location /assets/ { try_files $uri =404; }
    location / { try_files $uri $uri/ /index.html; }
}
