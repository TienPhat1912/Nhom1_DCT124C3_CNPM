services:
  api:
    environment:
      Web__Origin: https://localhost:8443
      Web__SecureCookies: 'true'
  web:
    ports: ['127.0.0.1:8443:443']
    healthcheck:
      test: ['CMD-SHELL', 'wget --no-check-certificate -q -O /dev/null https://127.0.0.1/api/config']
    volumes:
      - ./.local/tls:/etc/nginx/tls:ro
      - ./apps/web/nginx.https.conf:/etc/nginx/conf.d/default.conf:ro
