name: Deploy demo
on:
  workflow_dispatch:
    inputs:
      ci_run_id:
        description: Successful CI run from a push to master
        required: true
        type: string
permissions:
  contents: read
  actions: read
concurrency:
  group: demo-deployment
  cancel-in-progress: false
jobs:
  deploy:
    if: github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    environment: demo
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Verify trusted successful CI artifact
        id: gate
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_ID: ${{ inputs.ci_run_id }}
        run: |
          [[ "$RUN_ID" =~ ^[0-9]+$ ]] || exit 1
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$RUN_ID" > run.json
          python3 - <<'PY'
          import json, os, re
          run=json.load(open('run.json'))
          assert run['name']=='CI' and run['conclusion']=='success' and run['event']=='push' and run['head_branch']=='master'
          assert run['repository']['full_name']==os.environ['GITHUB_REPOSITORY']
          assert re.fullmatch('[0-9a-f]{40}',run['head_sha'])
          with open(os.environ['GITHUB_OUTPUT'],'a') as output: output.write('sha='+run['head_sha']+'\n')
          PY
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-${{ steps.gate.outputs.sha }}
          run-id: ${{ inputs.ci_run_id }}
          github-token: ${{ github.token }}
          path: release
      - name: Deploy the tested image archive to the configured demo host
        env:
          DEMO_HOST: ${{ secrets.DEMO_HOST }}
          DEMO_USER: ${{ secrets.DEMO_USER }}
          SSH_PRIVATE_KEY: ${{ secrets.DEMO_SSH_KEY }}
          SSH_KNOWN_HOSTS: ${{ secrets.DEMO_KNOWN_HOSTS }}
          RELEASE_TAG: ${{ steps.gate.outputs.sha }}
        run: |
          test -n "$DEMO_HOST" && test -n "$DEMO_USER" && test -n "$SSH_PRIVATE_KEY" && test -n "$SSH_KNOWN_HOSTS" || { echo 'Missing demo SSH environment configuration' >&2; exit 1; }
          [[ "$DEMO_HOST" =~ ^[a-zA-Z0-9.-]+$ ]] && [[ "$DEMO_USER" =~ ^[a-zA-Z0-9_-]+$ ]] || exit 1
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/demo_key
          printf '%s\n' "$SSH_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/demo_key ~/.ssh/known_hosts
          cd release && sha256sum --check SHA256SUMS && cd ..
          ssh -i ~/.ssh/demo_key -o StrictHostKeyChecking=yes "$DEMO_USER@$DEMO_HOST" "mkdir -p /srv/hospital-demo/releases/$RELEASE_TAG"
          scp -i ~/.ssh/demo_key -o StrictHostKeyChecking=yes -r release/. "$DEMO_USER@$DEMO_HOST:/srv/hospital-demo/releases/$RELEASE_TAG/"
          ssh -i ~/.ssh/demo_key -o StrictHostKeyChecking=yes "$DEMO_USER@$DEMO_HOST" "export RELEASE_TAG=$RELEASE_TAG; bash /srv/hospital-demo/releases/$RELEASE_TAG/scripts/release.sh"
