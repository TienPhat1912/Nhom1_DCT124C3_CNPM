name: Final codes Android APK
on:
  workflow_dispatch:
    inputs:
      ci_run_id:
        description: Successful Final codes CI run for this exact commit
        type: string
        required: true
      api_base_url:
        description: HTTPS API URL for the internal demo
        type: string
        required: true
permissions:
  contents: read
  actions: read
jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      EXPO_PUBLIC_API_BASE_URL: ${{ inputs.api_base_url }}
    steps:
      - name: Require successful checks for the exact commit
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_ID: ${{ inputs.ci_run_id }}
        run: |
          [[ "$RUN_ID" =~ ^[0-9]+$ ]] || exit 1
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$RUN_ID" > run.json
          python3 - <<'PY'
          import json,os
          run=json.load(open('run.json'))
          assert run['name']=='Final codes CI' and run['conclusion']=='success'
          assert run['event'] in ('push','workflow_dispatch')
          assert run['head_sha']==os.environ['GITHUB_SHA']
          assert run['repository']['full_name']==os.environ['GITHUB_REPOSITORY']
          PY
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22.19.0
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - name: Validate configuration and build
        working-directory: final codes/apps/mobile
        run: |
          node -e 'const u=new URL(process.env.EXPO_PUBLIC_API_BASE_URL);if(u.protocol!=="https:"||u.username||u.password||u.search||u.hash)process.exit(1)'
          npm ci
          npm run typecheck
          npm run prebuild
          cd android
          ./gradlew assembleRelease -PreactNativeArchitectures=arm64-v8a,x86_64
      - uses: actions/upload-artifact@v4
        with:
          name: final-android-${{ github.sha }}
          path: final codes/apps/mobile/android/app/build/outputs/apk/release/*.apk
          if-no-files-found: error
          retention-days: 14
