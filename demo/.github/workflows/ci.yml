name: CI
on:
  pull_request:
  push:
    branches: [master]
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22.19.0
          cache: npm
          cache-dependency-path: |
            apps/web/package-lock.json
            apps/mobile/package-lock.json
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: 9.0.x
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.13'
      - run: dotnet restore services/api/HospitalVisitApi.csproj --locked-mode
      - run: dotnet build services/api/HospitalVisitApi.csproj --no-restore
      - run: python scripts/test_backend_e2e.py
      - run: python scripts/benchmark.py
      - run: npm ci && npm run typecheck && npm run build
        working-directory: apps/web
      - run: npx playwright install --with-deps chromium && npm run test:e2e
        working-directory: apps/web
      - run: npm ci && npm run typecheck && npm run bundle
        working-directory: apps/mobile
      - run: dotnet publish services/api/HospitalVisitApi.csproj --no-restore -c Release -o .artifacts/api-publish
      - name: Build immutable images and smoke Compose
        env:
          RELEASE_TAG: ${{ github.sha }}
        run: |
          export JWT_SECRET="$(openssl rand -hex 32)"
          docker compose build
          docker compose up -d --wait --wait-timeout 120
          python scripts/smoke.py http://127.0.0.1:8080
          docker compose down
          mkdir -p .artifacts/release/scripts
          docker save -o .artifacts/release/images.tar "hospital-demo-api:$RELEASE_TAG" "hospital-demo-web:$RELEASE_TAG"
          cp compose.yml .artifacts/release/
          cp scripts/release.sh scripts/smoke.py .artifacts/release/scripts/
          cd .artifacts/release
          sha256sum images.tar compose.yml scripts/release.sh scripts/smoke.py > SHA256SUMS
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-${{ github.sha }}
          path: .artifacts/release
          retention-days: 14
          if-no-files-found: error
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: verification-${{ github.sha }}
          path: |
            .artifacts/playwright-report
            .artifacts/playwright-results
            .artifacts/performance.json
            .artifacts/patient-*.png
            apps/web/dist
            apps/mobile/dist
            .artifacts/api-publish
          retention-days: 7
