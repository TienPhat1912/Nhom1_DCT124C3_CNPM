name: Android internal APK
on:
  workflow_dispatch:
    inputs:
      ci_run_id:
        description: Successful CI push run for this commit on master
        type: string
        required: true
      api_base_url:
        description: Reachable demo API URL (no credentials)
        type: string
        required: true
permissions:
  contents: read
  actions: read
concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true
jobs:
  android:
    if: github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      EXPO_PUBLIC_API_BASE_URL: ${{ inputs.api_base_url }}
    steps:
      - name: Require the same trusted CI commit
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_ID: ${{ inputs.ci_run_id }}
        run: |
          [[ "$RUN_ID" =~ ^[0-9]+$ ]] || exit 1
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$RUN_ID" > run.json
          python3 - <<'PY'
          import json, os, urllib.parse
          run=json.load(open('run.json'))
          assert run['name']=='CI' and run['conclusion']=='success' and run['event']=='push' and run['head_branch']=='master'
          assert run['repository']['full_name']==os.environ['GITHUB_REPOSITORY'] and run['head_sha']==os.environ['GITHUB_SHA']
          url=urllib.parse.urlparse(os.environ['EXPO_PUBLIC_API_BASE_URL'])
          assert url.scheme in ('https','http') and url.hostname and not url.username and not url.password and not url.query and not url.fragment
          PY
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22.19.0
          cache: npm
          cache-dependency-path: apps/mobile/package-lock.json
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407 # v3
      - run: npm ci && npm run typecheck && npm run prebuild
        working-directory: apps/mobile
      - run: ./gradlew assembleRelease -PreactNativeArchitectures=arm64-v8a,x86_64
        working-directory: apps/mobile/android
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: android-internal-${{ github.sha }}
          path: apps/mobile/android/app/build/outputs/apk/release/*.apk
          if-no-files-found: error
          retention-days: 14
